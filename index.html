<!DOCTYPE html>
<html lang="pt-br">
<head>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Site</title>
</head>
<body>
    <nav>
        <p>Home </p>
        <p>Detalhes</p>
        <p>Frase do Dia</p>
        <p>Sobre Nós</p>
        <p>Empresa</p>
        <p>Algo</p>
        <p>Nao sei oque escrever</p>
        <p>Manga</p>
    </nav>
    <h1>Meu site</h1>

    <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit...</p>
    
    <form action="https://formspree.io/f/xdaqjgzn" method="POST" id="meu-form">
      <label>
        Your email:
        <input type="email" name="email" id="email">
      </label>
      <label>
        Your message:
        <textarea name="message" id="message"></textarea>
      </label>
      <button type="submit">Send</button>
    </form>

    <div id="texto-post"></div>

<script>
  const form = document.getElementById('meu-form');
  const textoPost = document.getElementById('texto-post');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    textoPost.innerText = "🤖 A IA está pensando...";

    const response = await fetch('https://lucasser.app.n8n.cloud/webhook/db58c1d5-fbed-4697-bec9-f71f286ad0c1', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('email').value,
        message: document.getElementById('message').value
      })
    });

    const text = await response.text();
    textoPost.innerHTML = marked.parse(text);
  });
</script>
</body>
</html>
